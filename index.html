<html>
<head>
<script src="https://aframe.io/releases/1.7.1/aframe.min.js"></script>
</head>
<body>
<a-scene>

  <!-- カメラ -->
  <a-camera position="0 1.6 5"></a-camera>

  <!-- 空 -->
  <a-sky color="#007cfe"></a-sky>

  <!-- 草原 -->
<a-plane
  position="0 0 0"
  rotation="-90 0 0"
  width="100"
  height="200"
  color="#99B600">
</a-plane>

<!-- 道 -->
<a-plane
  position="0 0.01 0"
  rotation="-90 0 0"
  width="3"
  height="200"
  color="#505a66">
</a-plane>

<!-- 道 -->
<a-plane
  position="0 0.02 0"
  rotation="-90 0 0"
  width="0.10"
  height="200"
  color="#e4c731">
</a-plane>

<!-- 気球 -->

<!-- 気球の風船部分 -->
<a-sphere
  position="0 8 -80"
  radius="2"
  color="#ff3b3b">
</a-sphere>

<!-- かご -->
<a-box
  position="0 4 -80"
  width="0.7"
  height="0.6"
  depth="0.7"
  color="#8B4513">
</a-box>

<!-- ロープ1 -->
<a-cylinder
  position="-0.3 5 -79.7"
  radius="0.02"
  height="2"
  color="#ffffff">
</a-cylinder>

<!-- ロープ2 -->
<a-cylinder
  position="0.3 5 -79.7"
  radius="0.02"
  height="2"
  color="#ffffff">
</a-cylinder>

<!-- ロープ3 -->
<a-cylinder
  position="-0.3 5 -80.3"
  radius="0.02"
  height="2"
  color="#ffffff">
</a-cylinder>

<!-- ロープ4 -->
<a-cylinder
  position="0.3 5 -80.3"
  radius="0.02"
  height="2"
  color="#ffffff">
</a-cylinder>


</a-scene>
</body>
</html>
